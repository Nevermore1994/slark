name: Slark Build

on:
  push:
    branches: ["main", "develop", "feat/**"]
  pull_request:
    branches: ["main"]

env:
  BUILD_TYPE: Release
  OPENSSL_VERSION: "3.0.13"

jobs:
  # ============================================================================
  # macOS Native Build
  # ============================================================================
  macos-build:
    name: macOS Build
    runs-on: macos-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache OpenSSL source
        id: cache-openssl-source
        uses: actions/cache@v4
        with:
          path: .cache/openssl
          key: openssl-source-${{ env.OPENSSL_VERSION }}

      - name: Cache OpenSSL build
        id: cache-openssl-build
        uses: actions/cache@v4
        with:
          path: build/deps/openssl
          key: openssl-macos-${{ env.OPENSSL_VERSION }}-${{ hashFiles('cmake/OpenSSL.cmake') }}

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} -j $(sysctl -n hw.ncpu)

      - name: Test
        working-directory: build
        run: ctest -C ${{ env.BUILD_TYPE }} --output-on-failure

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: macos-build
          path: |
            build/*.a
            build/*.dylib
          retention-days: 7

  linux-build:
    name: Linux Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Cache FetchContent
        uses: actions/cache@v4
        with:
          path: .fetchcontent_cache
          key: fetchcontent-linux-${{ hashFiles('cmake/gtest.cmake') }}

      - name: Configure CMake
        run: |
          cmake -S . -B build-linux \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_PLATFORM=PC \
            -DDISABLE_TEST=OFF \
            -DDISABLE_HTTP=OFF

      - name: Build and test
        run: |
          cmake --build build-linux --config ${{ env.BUILD_TYPE }} --parallel "$(nproc)"
          ctest --test-dir build-linux --output-on-failure \
            --output-junit test-results.xml

      - name: Upload Linux test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-results
          path: build-linux/test-results.xml
          if-no-files-found: warn
          retention-days: 7

  # ============================================================================
  # iOS Build
  # ============================================================================
  ios-build:
    name: iOS Build
    runs-on: macos-latest
    timeout-minutes: 90
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            platform: OS64
            target: iphoneos
          - arch: x86_64
            platform: SIMULATOR64
            target: iphonesimulator
          - arch: arm64
            platform: SIMULATORARM64
            target: iphonesimulator

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache OpenSSL source
        id: cache-openssl-source
        uses: actions/cache@v4
        with:
          path: .cache/openssl
          key: openssl-source-${{ env.OPENSSL_VERSION }}

      - name: Cache OpenSSL build for iOS
        id: cache-openssl-build
        uses: actions/cache@v4
        with:
          path: build-ios-${{ matrix.arch }}/deps/openssl
          key: openssl-ios-${{ matrix.target }}-${{ matrix.arch }}-${{ env.OPENSSL_VERSION }}-${{ hashFiles('cmake/OpenSSL.cmake') }}

      - name: Verify iOS toolchain
        run: test -f ios.toolchain.cmake

      - name: Configure CMake for iOS
        run: |
          cmake -B build-ios-${{ matrix.arch }} \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DPLATFORM=${{ matrix.platform }} \
            -DDEPLOYMENT_TARGET=16.5 \
            -DENABLE_BITCODE=OFF \
            -DENABLE_ARC=ON \
            -DENABLE_VISIBILITY=OFF \
            -DBUILD_PLATFORM=iOS \
            -DCMAKE_TOOLCHAIN_FILE=ios.toolchain.cmake

      - name: Build for iOS
        run: cmake --build build-ios-${{ matrix.arch }} --config ${{ env.BUILD_TYPE }} -j $(sysctl -n hw.ncpu)

      - name: Create Xcode project (optional)
        if: matrix.arch == 'arm64'
        run: |
          cmake -B xcode-project \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DPLATFORM=${{ matrix.platform }} \
            -DDEPLOYMENT_TARGET=16.5 \
            -DBUILD_PLATFORM=iOS \
            -DCMAKE_TOOLCHAIN_FILE=ios.toolchain.cmake

      - name: Upload iOS build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ios-${{ matrix.target }}-${{ matrix.arch }}-build
          path: |
            build-ios-${{ matrix.arch }}/${{ env.BUILD_TYPE }}-${{ matrix.target }}/slark.framework
          if-no-files-found: error
          retention-days: 7

  # ============================================================================
  # Android Build
  # ============================================================================
  android-build:
    name: Android Build
    runs-on: macos-latest
    timeout-minutes: 90
    
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-29" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          ndk_root="${sdk_root}/ndk/27.0.12077973"
          test -f "${ndk_root}/build/cmake/android.toolchain.cmake"
          echo "ANDROID_NDK_ROOT=${ndk_root}" >> "${GITHUB_ENV}"

      - name: Cache OpenSSL source
        id: cache-openssl-source
        uses: actions/cache@v4
        with:
          path: .cache/openssl
          key: openssl-source-${{ env.OPENSSL_VERSION }}

      - name: Cache OpenSSL build for Android
        id: cache-openssl-build
        uses: actions/cache@v4
        with:
          path: build-android-${{ matrix.abi }}/deps/openssl
          key: openssl-android-${{ matrix.abi }}-${{ env.OPENSSL_VERSION }}-${{ hashFiles('cmake/OpenSSL.cmake') }}

      - name: Configure CMake for Android
        run: |
          cmake -B build-android-${{ matrix.abi }} \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_SYSTEM_NAME=Android \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_shared \
            -DBUILD_PLATFORM=Android \
            -DDISABLE_TEST=ON \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake"

      - name: Build for Android
        run: cmake --build build-android-${{ matrix.abi }} --config ${{ env.BUILD_TYPE }} -j $(sysctl -n hw.ncpu)

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-${{ matrix.abi }}-build
          path: |
            build-android-${{ matrix.abi }}/**/*.so
          if-no-files-found: error
          retention-days: 7

  ios-test:
    name: iOS Simulator Tests
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify Xcode and simulator tools
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Run iOS simulator tests
        run: ./scripts/run_integration_test.sh ios

      - name: Upload iOS test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: test/output/**/ios_*.log
          if-no-files-found: warn
          retention-days: 7

  android-test:
    name: Android Instrumentation Tests
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android test environment
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          case "$(uname -m)" in
            arm64) emulator_abi=arm64-v8a ;;
            x86_64) emulator_abi=x86_64 ;;
            *) echo "Unsupported runner architecture: $(uname -m)"; exit 1 ;;
          esac
          system_image="system-images;android-35;google_apis;${emulator_abi}"
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "emulator" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973" \
            "ndk;29.0.13113456" \
            "${system_image}"
          echo no | avdmanager create avd \
            --force \
            --name slark_test \
            --package "${system_image}" \
            --device pixel_2

      - name: Run Android instrumentation tests
        run: ./scripts/run_integration_test.sh android

      - name: Upload Android test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: test/output/**/android_*.log
          if-no-files-found: warn
          retention-days: 7

  # ============================================================================
  # Summary Job
  # ============================================================================
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [macos-build, linux-build, ios-build, android-build, ios-test, android-test]
    if: always()
    
    steps:
      - name: Check build results
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| macOS build/test | ${{ needs.macos-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux build/test | ${{ needs.linux-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS build | ${{ needs.ios-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS simulator test | ${{ needs.ios-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Android build | ${{ needs.android-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Android instrumentation test | ${{ needs.android-test.result }} |" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.macos-build.result }}" != "success" ] || \
             [ "${{ needs.linux-build.result }}" != "success" ] || \
             [ "${{ needs.ios-build.result }}" != "success" ] || \
             [ "${{ needs.ios-test.result }}" != "success" ] || \
             [ "${{ needs.android-build.result }}" != "success" ] || \
             [ "${{ needs.android-test.result }}" != "success" ]; then
            echo ""
            echo "❌ Some builds failed. Please check the logs."
            exit 1
          fi
          echo ""
          echo "✅ All builds passed successfully!"
