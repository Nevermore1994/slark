name: Slark Build

on:
  push:
    branches: ["main", "develop", "feat/**"]
  pull_request:
    branches: ["main"]

env:
  BUILD_TYPE: Release
  OPENSSL_VERSION: "3.0.13"

jobs:
  # ============================================================================
  # macOS Native Build
  # ============================================================================
  macos-build:
    name: macOS Build
    runs-on: macos-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache OpenSSL source
        id: cache-openssl-source
        uses: actions/cache@v4
        with:
          path: .cache/openssl
          key: openssl-source-${{ env.OPENSSL_VERSION }}

      - name: Cache OpenSSL build
        id: cache-openssl-build
        uses: actions/cache@v4
        with:
          path: build/deps/openssl
          key: openssl-macos-${{ env.OPENSSL_VERSION }}-${{ hashFiles('cmake/OpenSSL.cmake') }}

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} -j $(sysctl -n hw.ncpu)

      - name: Test
        working-directory: build
        run: ctest -C ${{ env.BUILD_TYPE }} --output-on-failure

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: macos-build
          path: |
            build/*.a
            build/*.dylib
          retention-days: 7

  # ============================================================================
  # iOS Build
  # ============================================================================
  ios-build:
    name: iOS Build
    runs-on: macos-latest
    timeout-minutes: 90
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            platform: OS64
            target: iphoneos
          - arch: x86_64
            platform: SIMULATOR64
            target: iphonesimulator
          - arch: arm64
            platform: SIMULATORARM64
            target: iphonesimulator

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache OpenSSL source
        id: cache-openssl-source
        uses: actions/cache@v4
        with:
          path: .cache/openssl
          key: openssl-source-${{ env.OPENSSL_VERSION }}

      - name: Cache OpenSSL build for iOS
        id: cache-openssl-build
        uses: actions/cache@v4
        with:
          path: build-ios-${{ matrix.arch }}/deps/openssl
          key: openssl-ios-${{ matrix.arch }}-${{ env.OPENSSL_VERSION }}-${{ hashFiles('cmake/OpenSSL.cmake') }}

      - name: Verify iOS toolchain
        run: test -f ios.toolchain.cmake

      - name: Configure CMake for iOS
        run: |
          cmake -B build-ios-${{ matrix.arch }} \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DPLATFORM=${{ matrix.platform }} \
            -DDEPLOYMENT_TARGET=16.5 \
            -DENABLE_BITCODE=OFF \
            -DENABLE_ARC=ON \
            -DENABLE_VISIBILITY=OFF \
            -DBUILD_PLATFORM=iOS \
            -DCMAKE_TOOLCHAIN_FILE=ios.toolchain.cmake

      - name: Build for iOS
        run: cmake --build build-ios-${{ matrix.arch }} --config ${{ env.BUILD_TYPE }} -j $(sysctl -n hw.ncpu)

      - name: Create Xcode project (optional)
        if: matrix.arch == 'arm64'
        run: |
          cmake -B xcode-project \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DPLATFORM=${{ matrix.platform }} \
            -DDEPLOYMENT_TARGET=16.5 \
            -DBUILD_PLATFORM=iOS \
            -DCMAKE_TOOLCHAIN_FILE=ios.toolchain.cmake

      - name: Upload iOS build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ios-${{ matrix.target }}-${{ matrix.arch }}-build
          path: |
            build-ios-${{ matrix.arch }}/${{ env.BUILD_TYPE }}-${{ matrix.target }}/slark.framework
          if-no-files-found: error
          retention-days: 7

  # ============================================================================
  # Android Build
  # ============================================================================
  android-build:
    name: Android Build
    runs-on: macos-latest
    timeout-minutes: 90
    
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-29" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          ndk_root="${sdk_root}/ndk/27.0.12077973"
          test -f "${ndk_root}/build/cmake/android.toolchain.cmake"
          echo "ANDROID_NDK_ROOT=${ndk_root}" >> "${GITHUB_ENV}"

      - name: Cache OpenSSL source
        id: cache-openssl-source
        uses: actions/cache@v4
        with:
          path: .cache/openssl
          key: openssl-source-${{ env.OPENSSL_VERSION }}

      - name: Cache OpenSSL build for Android
        id: cache-openssl-build
        uses: actions/cache@v4
        with:
          path: build-android-${{ matrix.abi }}/deps/openssl
          key: openssl-android-${{ matrix.abi }}-${{ env.OPENSSL_VERSION }}-${{ hashFiles('cmake/OpenSSL.cmake') }}

      - name: Configure CMake for Android
        run: |
          cmake -B build-android-${{ matrix.abi }} \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_SYSTEM_NAME=Android \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_shared \
            -DBUILD_PLATFORM=Android \
            -DDISABLE_TEST=ON \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake"

      - name: Build for Android
        run: cmake --build build-android-${{ matrix.abi }} --config ${{ env.BUILD_TYPE }} -j $(sysctl -n hw.ncpu)

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-${{ matrix.abi }}-build
          path: |
            build-android-${{ matrix.abi }}/**/*.so
          if-no-files-found: error
          retention-days: 7

  # ============================================================================
  # Summary Job
  # ============================================================================
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [macos-build, ios-build, android-build]
    if: always()
    
    steps:
      - name: Check build results
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| macOS | ${{ needs.macos-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS (arm64) | ${{ needs.ios-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Android (arm64-v8a) | ${{ needs.android-build.result }} |" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.macos-build.result }}" != "success" ] || \
             [ "${{ needs.ios-build.result }}" != "success" ] || \
             [ "${{ needs.android-build.result }}" != "success" ]; then
            echo ""
            echo "❌ Some builds failed. Please check the logs."
            exit 1
          fi
          echo ""
          echo "✅ All builds passed successfully!"
